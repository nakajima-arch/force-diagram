<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>力の図示ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@1,500;1,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF2F6; --panel:#FFFFFF; --sunk:#E3E9EF; --ink:#16212C; --muted:#56657A; --line:#CFD8E2;
  --accent:#1F4E8C; --accent-ink:#FFFFFF; --accent-soft:#DCE7F5;
  --paper:#FFFFFF; --grid:#E6EDF4; --obj:#D5E1EE; --obj-line:#2E4257; --ground:#6E7E90; --rope:#6B5230; --slope:#E9EEF3;
  --c-g:#D0342C; --c-n:#1F6BD6; --c-T:#0D8F63; --c-k:#8A45CF; --c-f:#C97700; --c-p:#C23A7C; --c-b:#0A8FB0; --c-a:#6F8A00; --water:#3E9BD6;
  --ok:#1C8A55; --ng:#C6392F;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --math:"STIX Two Text","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10161D; --panel:#18212B; --sunk:#202B37; --ink:#E6ECF2; --muted:#9AA9BA; --line:#2F3C4B;
    --accent:#7FAEEA; --accent-ink:#0D1622; --accent-soft:#223449;
    --paper:#141C25; --grid:#1F2A36; --obj:#2A3A4C; --obj-line:#B8C7D8; --ground:#8A99AA; --rope:#C9A774; --slope:#1E2833;
    --c-g:#FF6B61; --c-n:#6CA8FF; --c-T:#3DD29A; --c-k:#C08CFF; --c-f:#FFB23E; --c-p:#FF7DB8; --c-b:#4FD3F0; --c-a:#B9D84A; --water:#4FA8E8;
    --ok:#4CC98A; --ng:#FF7A70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10161D; --panel:#18212B; --sunk:#202B37; --ink:#E6ECF2; --muted:#9AA9BA; --line:#2F3C4B;
  --accent:#7FAEEA; --accent-ink:#0D1622; --accent-soft:#223449;
  --paper:#141C25; --grid:#1F2A36; --obj:#2A3A4C; --obj-line:#B8C7D8; --ground:#8A99AA; --rope:#C9A774; --slope:#1E2833;
  --c-g:#FF6B61; --c-n:#6CA8FF; --c-T:#3DD29A; --c-k:#C08CFF; --c-f:#FFB23E; --c-p:#FF7DB8; --c-b:#4FD3F0; --c-a:#B9D84A; --water:#4FA8E8;
  --ok:#4CC98A; --ng:#FF7A70;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--round);text-wrap:balance;margin:0;line-height:1.35}
.m{font-family:var(--math);font-style:italic;font-weight:500;font-size:1.08em}

/* header */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px}
.brand small{display:block;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.brand h1{font-size:26px;color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tab{font:inherit;font-size:14px;font-weight:700;border:0;background:transparent;color:var(--muted);padding:6px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}

/* buttons */
.btn{font:inherit;font-weight:700;font-size:15px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  padding:10px 20px;border-radius:10px;cursor:pointer;touch-action:manipulation}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{font-size:13px;padding:6px 12px}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.tab:focus-visible,.chip input:focus-visible+span,.card:focus-visible,.fig-wrap:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.chip{position:relative;display:inline-flex}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;font-weight:700;color:var(--muted)}
.chip input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lv{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);letter-spacing:.05em}
.lv[data-lv="ひっかけ"]{background:color-mix(in srgb,var(--c-f) 18%,transparent);color:var(--c-f)}
.lv[data-lv="応用"]{background:color-mix(in srgb,var(--c-p) 16%,transparent);color:var(--c-p)}
.lv[data-lv="物理"]{background:var(--accent-soft);color:var(--accent)}

/* setup */
.setup h2{font-size:20px}
.rule{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--sunk);border-radius:10px;padding:12px 16px;font-size:14px}
.rule b{font-family:var(--round);color:var(--accent)}

/* play */
.progress{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.q-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.q-title{font-size:20px}
.q-text{margin:0;font-size:15px}
.fig-wrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--paper);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.fig-wrap.done{cursor:default}
.fig{display:block;width:100%;height:auto;max-height:52vh}
.tap-note{position:absolute;right:10px;bottom:8px;font-size:12px;font-weight:700;color:var(--accent);background:var(--panel);border:1px solid var(--line);padding:2px 10px;border-radius:99px;pointer-events:none}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.controls .btn{flex:1 1 auto}

.hint{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:14px;margin:0}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.flist li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;border:1px solid var(--line);animation:pop .3s ease-out}
.flist .sw{width:34px;height:18px}
.flist .nm{font-weight:700}
.flist .from{font-size:13px;color:var(--muted)}
.flist .step{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);display:block}
.point{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:14px;margin:0}
.point b{font-family:var(--round);color:var(--accent);display:block;font-size:13px;letter-spacing:.1em}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.judge .ok{background:var(--ok);border-color:var(--ok)}
.judge .ng{background:var(--ng);border-color:var(--ng)}
@keyframes pop{from{transform:translateY(4px);opacity:.3}to{transform:none;opacity:1}}

/* svg */
.fig .grid{stroke:var(--grid);stroke-width:1}
.fig .ground{stroke:var(--ground);stroke-width:2;fill:none}
.fig .hatch{stroke:var(--ground);stroke-width:1.2;opacity:.7}
.fig .obj{fill:var(--obj);stroke:var(--obj-line);stroke-width:2}
.fig .obj.dim{opacity:.35}
.fig .objlabel{font-family:var(--sans);font-weight:700;font-size:15px;fill:var(--obj-line);text-anchor:middle;dominant-baseline:central}
.fig .rope{stroke:var(--rope);stroke-width:2;fill:none}
.fig .slope{fill:var(--slope);stroke:var(--ground);stroke-width:2}
.fig .hand{fill:var(--sunk);stroke:var(--muted);stroke-width:1.5}
.fig .handlabel{font-family:var(--sans);font-size:12px;fill:var(--muted);text-anchor:middle;dominant-baseline:central}
.fig .motion{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 5;fill:none}
.fig .motionhead{fill:var(--muted)}
.fig .motionlabel{font-family:var(--sans);font-size:12px;fill:var(--muted);writing-mode:vertical-rl}
.fig .note{font-family:var(--sans);font-size:12px;fill:var(--muted)}
.fig .orbit{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 4;fill:none}
.fig .water{fill:var(--water);fill-opacity:.22}
.fig .waterline{stroke:var(--water);stroke-width:1.5;fill:none}
.fig .earth{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.force{color:var(--c)}
.force .shaft{stroke:currentColor;stroke-width:3.4;stroke-linecap:round;fill:none}
.force .head,.force .dot{fill:currentColor}
.force .lab{font-family:var(--math);font-style:italic;font-weight:600;font-size:19px;fill:currentColor;paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.force .lab .sub{font-size:13px}
.force.off{display:none}
.force.drawn .shaft{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out forwards}
.force.drawn .head,.force.drawn .lab{opacity:0;animation:fade .2s ease-out .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.t-b{--c:var(--c-b)} .t-a{--c:var(--c-a)}
.t-g{--c:var(--c-g)} .t-n{--c:var(--c-n)} .t-T{--c:var(--c-T)} .t-k{--c:var(--c-k)} .t-f{--c:var(--c-f)} .t-p{--c:var(--c-p)}

/* result */
.score{font-family:var(--round);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:18px;color:var(--muted)}
.miss{margin:0;padding-left:1.2em}

/* list */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{font:inherit;text-align:left;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card .fig{border-radius:8px;border:1px solid var(--line);background:var(--paper)}
.card h3{font-size:15px}
.card .weak{font-size:11px;font-weight:700;color:var(--ng)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:18px;height:4px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:middle}
footer{margin-top:28px;font-size:12px;color:var(--muted)}

@media (max-width:480px){
  .brand h1{font-size:22px}
  .panel{padding:16px}
  .q-title{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .force.drawn .shaft{stroke-dasharray:none}
  .force.drawn .head,.force.drawn .lab{opacity:1}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <small>物理基礎・物理 ｜ 力の図示</small>
      <h1>力の図示ドリル</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-play" data-view="play" aria-selected="true">れんしゅう</button>
      <button class="tab" role="tab" id="tab-list" data-view="list" aria-selected="false">問題一覧</button>
    </nav>
  </header>

  <!-- れんしゅう -->
  <section id="view-play">
    <div class="panel stack setup" id="setup">
      <h2>問題をえらんでスタート</h2>
      <div class="rule">
        <b>①</b><span>まず <span class="m">mg</span>（重力）をかく。</span>
        <b>②</b><span>物体が<strong>ふれているもの</strong>から受ける力をかく（床・糸・ばね・手・かべ など）。</span>
      </div>
      <p class="small muted" style="margin:0">ノートに力の矢印をかいてから，図をタップして答え合わせをしよう。</p>
      <div class="stack" style="gap:8px">
        <span class="small muted">レベル</span>
        <div class="row" id="levels"></div>
      </div>
      <div class="row">
        <label class="chip"><input type="checkbox" id="only-weak"><span>苦手な問題だけ</span></label>
      </div>
      <div class="row">
        <button class="btn" id="start">スタート</button>
        <span class="small muted" id="count"></span>
      </div>
      <div class="row"><button class="btn ghost sm" id="clear-weak" hidden>苦手の記録を消す</button></div>
    </div>

    <div class="panel stack" id="play" hidden>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
      <div class="q-head">
        <div class="row"><span class="lv" id="q-lv"></span><span class="small muted" id="q-num"></span></div>
        <button class="btn ghost sm" id="quit">やめる</button>
      </div>
      <h2 class="q-title" id="q-title"></h2>
      <p class="q-text" id="q-text"></p>
      <div class="fig-wrap" id="fig" tabindex="0" role="button" aria-label="タップして力を1つ表示"></div>
      <div class="controls">
        <button class="btn ghost" id="btn-hint">ヒント</button>
        <button class="btn ghost" id="btn-next-force">力を1つ表示</button>
        <button class="btn ghost" id="btn-all">全部表示</button>
      </div>
      <p class="hint" id="hint" hidden></p>
      <ol class="flist" id="flist"></ol>
      <p class="point" id="point" hidden></p>
      <div class="judge" id="judge" hidden>
        <button class="btn ok" id="j-ok">全部かけた</button>
        <button class="btn ng" id="j-ng">かけなかった力がある</button>
      </div>
    </div>

    <div class="panel stack" id="result" hidden>
      <h2>おつかれさま！</h2>
      <div class="score" id="score"></div>
      <div id="miss-wrap" class="stack" style="gap:6px">
        <span class="small muted">かけなかった問題</span>
        <ul class="miss" id="miss"></ul>
      </div>
      <div class="row">
        <button class="btn" id="retry-miss">かけなかった問題をもう一度</button>
        <button class="btn ghost" id="back">問題えらびにもどる</button>
      </div>
    </div>
  </section>

  <!-- 問題一覧 -->
  <section id="view-list" class="stack" hidden>
    <div class="row" style="justify-content:space-between">
      <label class="chip"><input type="checkbox" id="show-ans"><span>答えも表示する</span></label>
      <div class="legend">
        <span style="--c:var(--c-g)">重力</span><span style="--c:var(--c-n)">垂直抗力</span><span style="--c:var(--c-T)">張力</span>
        <span style="--c:var(--c-k)">弾性力</span><span style="--c:var(--c-f)">摩擦力</span><span style="--c:var(--c-b)">浮力</span><span style="--c:var(--c-p)">手の力</span>
      </div>
    </div>
    <div class="grid-cards" id="cards"></div>
    <p class="small muted" style="margin:0">カードをタップすると，その問題だけを練習できます。</p>
  </section>

  <footer>チェックするのは「力の名前」「作用点」「向き」の3つ。作用点は，重力なら物体の中心，ほかの力はふれている点（面）にとる。矢印の長さはおおよそでよい。</footer>
</div>

<script src="data.js"></script>
<script>
/* ---------- 図の部品 ---------- */
function n(v){return Math.round(v*10)/10;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
var G={
  floor:function(x1,x2,y){var s='<line class="ground" x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'"/>';
    for(var x=x1+4;x<x2;x+=10)s+='<line class="hatch" x1="'+x+'" y1="'+(y+1)+'" x2="'+(x-8)+'" y2="'+(y+9)+'"/>';return s;},
  ceiling:function(x1,x2,y){var s='<line class="ground" x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'"/>';
    for(var x=x1+4;x<x2;x+=10)s+='<line class="hatch" x1="'+(x-8)+'" y1="'+(y-9)+'" x2="'+x+'" y2="'+(y-1)+'"/>';return s;},
  wall:function(x,y1,y2,side){var d=side==="L"?-1:1,s='<line class="ground" x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'"/>';
    for(var y=y1+4;y<y2;y+=10)s+='<line class="hatch" x1="'+(x+d)+'" y1="'+y+'" x2="'+(x+9*d)+'" y2="'+(y-8)+'"/>';return s;},
  water:function(x1,x2,yt,yb){var s='<rect class="water" x="'+x1+'" y="'+yt+'" width="'+(x2-x1)+'" height="'+(yb-yt)+'"/>',d='M'+x1+' '+yt;
    for(var x=x1;x<x2;x+=20)d+=' q5 -3 10 0 t10 0';
    return s+'<path class="waterline" d="'+d+'"/><polyline class="ground" points="'+x1+','+(yt-22)+' '+x1+','+yb+' '+x2+','+yb+' '+x2+','+(yt-22)+'"/>';},
  text:function(x,y,s,anchor){return '<text class="note" x="'+x+'" y="'+y+'" text-anchor="'+(anchor||"middle")+'">'+esc(s)+'</text>';},
  orbit:function(cx,cy,rx,ry){return '<ellipse class="orbit" cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/>';},
  path:function(d){return '<path class="orbit" d="'+d+'"/>';},
  earth:function(cx,cy,r){return '<circle class="earth" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/><text class="objlabel" x="'+cx+'" y="'+cy+'">地球</text>';},
  disk:function(cx,cy,rx,ry){return '<line class="ground" x1="'+cx+'" y1="'+(cy+ry)+'" x2="'+cx+'" y2="'+(cy+ry+40)+'"/><ellipse class="slope" cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'"/><circle cx="'+cx+'" cy="'+cy+'" r="3" fill="var(--ground)"/>';},
  pulley:function(cx,cy,r,mx,my){return '<line class="ground" x1="'+cx+'" y1="'+cy+'" x2="'+mx+'" y2="'+my+'"/><circle class="slope" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/><circle cx="'+cx+'" cy="'+cy+'" r="2.5" fill="var(--ground)"/>';},
  pin:function(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="4" fill="var(--ground)"/>';},
  mark:function(x,y1,y2,label){return '<line class="orbit" x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'"/><text class="note" x="'+x+'" y="'+(y1-6)+'" text-anchor="middle">'+esc(label)+'</text>';},
  box:function(x,y,w,h,label,o){o=o||{};return '<g class="obj-g"><rect class="obj'+(o.dim?' dim':'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2"/>'
    +(label?'<text class="objlabel"'+(o.dim?' opacity=".45"':'')+' x="'+(x+10)+'" y="'+(y+11)+'">'+esc(label)+'</text>':'')+'</g>';},
  poly:function(pts,label,o){o=o||{};return '<polygon class="obj'+(o.dim?' dim':'')+'" points="'+pts.map(function(p){return p.join(",");}).join(" ")+'"/>';},
  shape:function(d,o){o=o||{};return '<path class="obj'+(o.dim?' dim':'')+'" d="'+d+'"/>';},
  cart:function(x,y,w,h,o){o=o||{};var c=o.dim?' dim':'',r=8,b=y+h;
    return '<rect class="obj'+c+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2"/>'
      +'<circle class="obj'+c+'" cx="'+(x+w*0.18)+'" cy="'+(b+r)+'" r="'+r+'"/><circle class="obj'+c+'" cx="'+(x+w*0.82)+'" cy="'+(b+r)+'" r="'+r+'"/>';},
  slope:function(pts){return '<polygon class="slope" points="'+pts.map(function(p){return p.join(",");}).join(" ")+'"/>';},
  ball:function(x,y,r,label){return '<circle class="obj" cx="'+x+'" cy="'+y+'" r="'+r+'"/>';},
  rope:function(x1,y1,x2,y2){return '<line class="rope" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';},
  spring:function(x1,y1,x2,y2){var L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,px=-uy,py=ux,k=10,lead=8,d='M'+x1+' '+y1;
    d+=' L'+n(x1+ux*lead)+' '+n(y1+uy*lead);var seg=(L-2*lead)/k;
    for(var i=0;i<k;i++){var t=lead+seg*(i+.5),s=(i%2?-1:1)*9;d+=' L'+n(x1+ux*t+px*s)+' '+n(y1+uy*t+py*s);}
    d+=' L'+n(x2-ux*lead)+' '+n(y2-uy*lead)+' L'+x2+' '+y2;return '<path class="rope" d="'+d+'"/>';},
  hand:function(x,y,side){var x0=side==="R"?x-2:x-70;return '<rect class="hand" x="'+x0+'" y="'+(y-11)+'" width="72" height="22" rx="11"/><text class="handlabel" x="'+(x0+34)+'" y="'+y+'">手</text>';},
  peg:function(x,y,yb){return '<line class="ground" x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+yb+'"/><circle cx="'+x+'" cy="'+y+'" r="4" fill="var(--ground)"/>';},
  motion:function(x1,y1,x2,y2,label){var L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,bx=x2-ux*10,by=y2-uy*10;
    return '<line class="motion" x1="'+x1+'" y1="'+y1+'" x2="'+n(bx)+'" y2="'+n(by)+'"/>'
      +'<polygon class="motionhead" points="'+x2+','+y2+' '+n(bx-uy*5)+','+n(by+ux*5)+' '+n(bx+uy*5)+','+n(by-ux*5)+'"/>'
      +(Math.abs(y2-y1)>Math.abs(x2-x1)*1.5
        ?'<text class="motionlabel" x="'+(Math.min(x1,x2)-18)+'" y="'+(Math.min(y1,y2)+10)+'">'+esc(label||"")+'</text>'
        :'<text class="note" x="'+n((x1+x2)/2)+'" y="'+n(Math.min(y1,y2)-8)+'" text-anchor="middle">'+esc(label||"")+'</text>');}
};

/* ---------- 力 ---------- */
var FORCE={g:"重力",n:"垂直抗力",T:"張力",k:"弾性力（ばねが引く力）",f:"静止摩擦力",p:"手が押す力",b:"浮力",a:"空気抵抗"};
function symSVG(s){var p=String(s).split("_");return esc(p[0])+(p[1]?'<tspan class="sub" dy="5">'+esc(p[1])+'</tspan>':'');}
function symHTML(s){var p=String(s).split("_");return '<span class="m">'+esc(p[0])+(p[1]?'<sub>'+esc(p[1])+'</sub>':'')+'</span>';}
function arrowSVG(f,i,cls){
  var L=Math.hypot(f.dx,f.dy),ux=f.dx/L,uy=f.dy/L,hl=11,hw=5.5,ex=f.x+f.dx,ey=f.y+f.dy,bx=ex-ux*hl,by=ey-uy*hl;
  return '<g class="force t-'+f.t+' '+cls+'" data-i="'+i+'">'
    +'<line class="shaft" pathLength="1" x1="'+f.x+'" y1="'+f.y+'" x2="'+n(bx)+'" y2="'+n(by)+'"/>'
    +'<polygon class="head" points="'+n(ex)+','+n(ey)+' '+n(bx-uy*hw)+','+n(by+ux*hw)+' '+n(bx+uy*hw)+','+n(by-ux*hw)+'"/>'
    +'<circle class="dot" cx="'+f.x+'" cy="'+f.y+'" r="3.4"/>'
    +'<text class="lab" x="'+f.lx+'" y="'+f.ly+'">'+symSVG(f.sym)+'</text></g>';
}
function figSVG(p,showAll){
  var grid='';for(var x=20;x<320;x+=20)grid+='<line class="grid" x1="'+x+'" y1="0" x2="'+x+'" y2="240"/>';
  for(var y=20;y<240;y+=20)grid+='<line class="grid" x1="0" y1="'+y+'" x2="320" y2="'+y+'"/>';
  var fs=p.forces.map(function(f,i){return arrowSVG(f,i,showAll?'':'off');}).join("");
  return '<svg class="fig" viewBox="0 0 320 240" role="img" aria-label="'+esc(p.title)+'の図">'+grid+p.scene(G)+fs+'</svg>';
}
function swatch(t){return '<svg class="sw t-'+t+' force" viewBox="0 0 34 18" aria-hidden="true"><line class="shaft" x1="3" y1="9" x2="22" y2="9"/><polygon class="head" points="32,9 21,3.5 21,14.5"/></svg>';}

/* ---------- 保存（苦手の記録） ---------- */
var store={get:function(k,fb){try{var v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
var WEAK_KEY="forceQuiz.weak";
function weak(){return store.get(WEAK_KEY,[]);}
function setWeak(id,on){var w=weak().filter(function(x){return x!==id;});if(on)w.push(id);store.set(WEAK_KEY,w);}

/* ---------- 画面 ---------- */
var $=function(id){return document.getElementById(id);};
var LEVELS=["基本","標準","ひっかけ","応用","物理"];
$("levels").innerHTML=LEVELS.map(function(l){return '<label class="chip"><input type="checkbox" id="lv-'+l+'" value="'+l+'"'+(l==="物理"?"":" checked")+'><span>'+l+'</span></label>';}).join("");

function pool(){
  var lv=LEVELS.filter(function(l){return $("lv-"+l).checked;}),w=weak(),only=$("only-weak").checked;
  return PROBLEMS.filter(function(p){return lv.indexOf(p.level)>=0&&(!only||w.indexOf(p.id)>=0);});
}
function refreshSetup(){
  var c=pool().length;$("count").textContent=c?c+"問":"問題がありません";$("start").disabled=!c;
  $("clear-weak").hidden=!weak().length;
}
document.querySelectorAll("#setup input").forEach(function(el){el.addEventListener("change",refreshSetup);});
$("clear-weak").addEventListener("click",function(){store.set(WEAK_KEY,[]);$("only-weak").checked=false;refreshSetup();});

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function order(list){ /* レベル順（基本→応用）に並べ、同じレベルの中はランダム */
  return LEVELS.reduce(function(acc,l){return acc.concat(shuffle(list.filter(function(p){return p.level===l;})));},[]);
}

var S={queue:[],idx:0,shown:0,results:[]};
function show(id){["setup","play","result"].forEach(function(k){$(k).hidden=k!==id;});window.scrollTo({top:0});}
function startWith(list){S.queue=list;S.idx=0;S.results=[];show("play");renderQ();}
$("start").addEventListener("click",function(){startWith(order(pool()));});

function renderQ(){
  var p=S.queue[S.idx];S.shown=0;
  $("bar").style.width=(S.idx/S.queue.length*100)+"%";
  $("q-lv").textContent=p.level;$("q-lv").dataset.lv=p.level;
  $("q-num").textContent=(S.idx+1)+" / "+S.queue.length;
  $("q-title").textContent=p.title;$("q-text").textContent=p.text;
  $("fig").innerHTML=figSVG(p,false)+'<span class="tap-note">タップで力を表示</span>';
  $("fig").classList.remove("done");
  $("hint").hidden=true;$("flist").innerHTML="";$("point").hidden=true;$("judge").hidden=true;
  ["btn-hint","btn-next-force","btn-all"].forEach(function(b){$(b).disabled=false;});
}
function hintText(p){
  var fr=[];p.forces.forEach(function(f){if(f.from!=="地球"&&fr.indexOf(f.from)<0)fr.push(f.from);});
  return (fr.length?"ふれているもの："+fr.join("，"):"ふれているものは ありません")+"。はたらく力は全部で "+p.forces.length+" つ。";
}
function revealOne(){
  var p=S.queue[S.idx];if(S.shown>=p.forces.length)return;
  var i=S.shown++,f=p.forces[i],g=$("fig").querySelector('.force[data-i="'+i+'"]');
  g.classList.remove("off");g.classList.add("drawn");
  var step=f.t==="g"?"① まず重力"+(f.name?"（"+f.name+"）":""):"② ふれている"+f.from+"から";
  var li=document.createElement("li");
  li.innerHTML=swatch(f.t)+'<div><span class="step">'+esc(step)+'</span><span class="nm">'+esc(f.name||FORCE[f.t])+' '+symHTML(f.sym)+'</span> <span class="from">… '+esc(f.from)+'から受ける力</span></div>';
  $("flist").appendChild(li);
  if(S.shown>=p.forces.length)finishQ();
}
function finishQ(){
  var p=S.queue[S.idx];
  $("fig").classList.add("done");var tn=$("fig").querySelector(".tap-note");if(tn)tn.remove();
  ["btn-next-force","btn-all"].forEach(function(b){$(b).disabled=true;});
  $("point").innerHTML='<b>ポイント</b>'+esc(p.point);$("point").hidden=false;$("judge").hidden=false;
}
$("fig").addEventListener("click",revealOne);
$("fig").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();revealOne();}});
$("btn-next-force").addEventListener("click",revealOne);
$("btn-all").addEventListener("click",function(){var p=S.queue[S.idx];while(S.shown<p.forces.length)revealOne();});
$("btn-hint").addEventListener("click",function(){$("hint").textContent=hintText(S.queue[S.idx]);$("hint").hidden=false;$("btn-hint").disabled=true;});
function judge(ok){
  var p=S.queue[S.idx];S.results.push({p:p,ok:ok});setWeak(p.id,!ok);
  S.idx++;if(S.idx<S.queue.length)renderQ();else renderResult();
}
$("j-ok").addEventListener("click",function(){judge(true);});
$("j-ng").addEventListener("click",function(){judge(false);});
$("quit").addEventListener("click",function(){show("setup");refreshSetup();});

function renderResult(){
  var ok=S.results.filter(function(r){return r.ok;}).length,miss=S.results.filter(function(r){return !r.ok;});
  $("score").innerHTML=ok+'<small> / '+S.results.length+' 問 全部かけた</small>';
  $("miss").innerHTML=miss.map(function(r){return '<li>'+esc(r.p.title)+'</li>';}).join("");
  $("miss-wrap").hidden=!miss.length;$("retry-miss").hidden=!miss.length;
  show("result");
}
$("retry-miss").addEventListener("click",function(){startWith(S.results.filter(function(r){return !r.ok;}).map(function(r){return r.p;}));});
$("back").addEventListener("click",function(){show("setup");refreshSetup();});

/* ---------- 問題一覧 ---------- */
function renderCards(){
  var ans=$("show-ans").checked,w=weak();
  $("cards").innerHTML=PROBLEMS.map(function(p,i){
    return '<button class="card" data-i="'+i+'">'+figSVG(p,ans)
      +'<div class="row"><span class="lv" data-lv="'+p.level+'">'+p.level+'</span>'+(w.indexOf(p.id)>=0?'<span class="weak">苦手</span>':'')+'</div>'
      +'<h3>'+esc(p.title)+'</h3></button>';}).join("");
}
$("show-ans").addEventListener("change",renderCards);
$("cards").addEventListener("click",function(e){var c=e.target.closest(".card");if(!c)return;setView("play");startWith([PROBLEMS[+c.dataset.i]]);});

/* ---------- タブ ---------- */
function setView(v){
  document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",t.dataset.view===v);});
  $("view-play").hidden=v!=="play";$("view-list").hidden=v!=="list";
  if(v==="list")renderCards();
}
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){setView(t.dataset.view);if(t.dataset.view==="play"&&$("result").hidden&&$("play").hidden){refreshSetup();}});});
refreshSetup();
</script>

</body>
</html>
