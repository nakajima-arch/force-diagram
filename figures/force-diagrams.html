<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>力の図示の見本</title>
<style>body{font-family:"Hiragino Sans","Noto Sans JP","IPAGothic",sans-serif;margin:16px;max-width:820px}
figure{margin:0 0 22px;border-bottom:1px solid #ccc;padding-bottom:12px}img{height:auto;width:calc(var(--w) * 0.727px)}figcaption{font-size:14px;color:#444;margin-top:6px}
h1{font-size:18px}h2{font-size:15px;margin:0 0 6px}ul{font-size:14px;line-height:1.7}</style></head><body>
<h1>力の図示の見本</h1>
<ul><li>作用点は ● 。重力は重心、ほかは物体がふれている点(面・糸・ばね・手)から。</li>
<li>長さは力の大きさに比例。つりあう力は同じ長さで「=」の印。</li>
<li>加速度 ⇨ は物体ごと。運動の向きは細い黒矢印(力ではない)。</li>
<li>注目する物体は点線で囲む。触れていないものから受ける力は描かない。</li></ul>
<figure><h2>1. つるしたおもり</h2><img src="force_1_hanging.svg" alt="1. つるしたおもり" style="--w:640"><figcaption>重力は重心から。張力は糸との接点から(糸に沿って、糸の側へ)。注目する物体を点線で囲む。T₂ と mg は同じ長さ(つりあい)で「=」の印。</figcaption></figure>
<figure><h2>2. あらい水平面上の物体</h2><img src="force_2_friction.svg" alt="2. あらい水平面上の物体" style="--w:600"><figcaption>重力は重心から。N と f は床との接触点から、F は手(糸)がふれている点から。N = mg、f = F はそれぞれ同じ長さで同じ印。摩擦力は、動こうとする向きと逆。</figcaption></figure>
<figure><h2>3. 斜面上で静止する物体</h2><img src="force_3_slope.svg" alt="3. 斜面上で静止する物体" style="--w:470"><figcaption>重力を点線の長方形で、斜面方向(朱)と垂直方向(青)に分ける。f は朱、N は青。成分と同じ長さの力に「=」の印。辺の比(1 : √3 : 2)の三角形を添える。</figcaption></figure>
<figure><h2>4. 連結した 2 物体</h2><img src="force_4_pulley.svg" alt="4. 連結した 2 物体" style="--w:580"><figcaption>物体ごとに点線の枠、力、加速度 ⇨ を描く。T は同じ長さ・同じ印(軽い糸の張力はどこでも同じ)。B は下向きに加速するので、mg が T より長い。</figcaption></figure>
<figure><h2>5. 手で持ち上げる</h2><img src="force_5_lift.svg" alt="5. 手で持ち上げる" style="--w:520"><figcaption>上向きに加速するので、手の力 f は重力 mg より長い(つりあいではない)。加速度 ⇧ は力とは別に、横に描く。</figcaption></figure>
</body></html>
